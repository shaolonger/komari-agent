name: Security Regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run security regression checks
        shell: pwsh
        run: .\scripts\verify-security-regression.ps1 -SkipLiveReleaseCheck

  race-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run race detector
        run: go test -race ./...

      - name: Verify reproducible PGO release build
        run: ./scripts/verify-reproducible-build.sh
