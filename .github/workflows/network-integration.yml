name: Optional Network Integration

on:
  workflow_dispatch:
    inputs:
      go_test_run:
        description: Go test regex for optional network/integration cases
        required: false
        default: ^TestIntegration

permissions:
  contents: read

jobs:
  network-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"

      - name: Run optional network integration tests
        run: go test ./... -run '${{ inputs.go_test_run }}'
